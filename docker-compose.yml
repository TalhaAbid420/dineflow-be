services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dineflow
      POSTGRES_PASSWORD: dineflow
      POSTGRES_DB: dineflow
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dineflow -d dineflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file:
      - ../.env
    environment:
      POSTGRES_DATABASE_URL: postgresql://dineflow:dineflow@db:5432/dineflow
      MONGODB_URI: mongodb://mongo:27017
      BACKEND_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data:
