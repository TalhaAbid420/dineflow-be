[project]
name = "dineflow-be"
version = "0.1.0"
description = "Dineflow restaurant ordering agent backend (FastAPI + OpenAI Agents SDK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.55.0",
    "openai-agents>=0.0.9",
    "pydantic-settings>=2.4.0",
    "asyncpg>=0.29.0",
    "motor>=3.6.0",
]

[tool.uv]
package = false
